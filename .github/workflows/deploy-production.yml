name: admin-release-preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure existing deployment identity
        env:
          DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/future_viewer_deploy
          chmod 600 ~/.ssh/future_viewer_deploy
          printf '%s\n' '80.87.104.245 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIe+wys2gdXm1hTHtWupCc1RMbVE296SI2SN34OXWltK' > ~/.ssh/known_hosts
      - name: Verify running release and aggregate pagination payload
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/future_viewer_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=25 deploy@80.87.104.245 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/future-viewer
          git rev-parse HEAD
          git status --short
          sudo -n docker inspect future-viewer-backend-1 future-viewer-frontend-1 future-viewer-caddy-1 --format '{{.Name}} {{.Config.Image}} {{.Image}} {{.State.StartedAt}} {{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}'
          sudo -n env FV_SHARED_EDGE_PORT=18080 docker compose --env-file /opt/fv-app/.env.production -f docker-compose.prod.yml -p future-viewer ps
          sudo -n docker exec -i future-viewer-postgres-1 sh -c 'PGOPTIONS="-c default_transaction_read_only=on -c statement_timeout=15000" psql -X -qAt -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          WITH visible AS (SELECT * FROM readings WHERE (user_id IS NOT NULL AND saved_to_history) OR (user_id IS NULL AND created_at > now()-interval '30 days' AND question<>'')), page AS (SELECT question,ai_interpretation FROM visible ORDER BY created_at DESC,id DESC LIMIT 20)
          SELECT json_build_object('page_rows',count(*),'question_bytes',sum(octet_length(question)),'answer_bytes',sum(octet_length(coalesce(ai_interpretation,''))),'max_answer_bytes',max(octet_length(coalesce(ai_interpretation,'')))) FROM page;
          SELECT json_build_object('retained_guests_older_than_24h',count(*) FILTER (WHERE created_at<now()-interval '24 hours'),'oldest_guest_hours',round(extract(epoch FROM now()-min(created_at))/3600,1)) FROM readings WHERE user_id IS NULL;
          SELECT "MigrationId" FROM "__EFMigrationsHistory" ORDER BY "MigrationId";
          SQL
          REMOTE
      - name: Remove temporary credential
        if: always()
        run: rm -f ~/.ssh/future_viewer_deploy
