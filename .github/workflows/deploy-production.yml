name: guest-history-delivery-preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure existing deployment identity
        env:
          DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/future_viewer_deploy
          chmod 600 ~/.ssh/future_viewer_deploy
          printf '%s\n' '80.87.104.245 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIe+wys2gdXm1hTHtWupCc1RMbVE296SI2SN34OXWltK' > ~/.ssh/known_hosts
      - name: Read current production state
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/future_viewer_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=25 deploy@80.87.104.245 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/future-viewer
          git rev-parse HEAD
          git status --short
          sudo -n docker ps --format '{{.Names}} {{.ID}} {{.Image}} {{.Status}}'
          sudo -n docker inspect future-viewer-backend-1 future-viewer-frontend-1 future-viewer-caddy-1 --format '{{.Name}} {{.Config.Image}} {{.Image}} {{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}'
          sudo -n stat -c '%a %U %n' /opt/fv-app/.env.production
          sudo -n docker compose version --short
          REMOTE
      - name: Remove temporary credential
        if: always()
        run: rm -f ~/.ssh/future_viewer_deploy
