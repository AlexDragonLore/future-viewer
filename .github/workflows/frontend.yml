name: frontend

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Compliance and legal publication checks
        working-directory: ${{ github.workspace }}
        run: node scripts/check-compliance.mjs --scope=frontend

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Install browser for compliance E2E
        run: npx playwright install --with-deps chromium

      - name: Browser compliance E2E
        run: npm run test:e2e

      - name: Production build
        run: npm run build
