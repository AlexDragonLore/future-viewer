# Local development compose. Production server deployment uses docker-compose.prod.yml.
name: ${FV_COMPOSE_PROJECT_NAME:-future-viewer-dev}

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    container_name: fv-postgres
    environment:
      POSTGRES_USER: future_viewer
      POSTGRES_PASSWORD: future_viewer_dev
      POSTGRES_DB: future_viewer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U future_viewer -d future_viewer"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - data
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fv-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=future_viewer;Username=future_viewer;Password=future_viewer_dev
      Jwt__Secret: ${JWT_SECRET:-dev-secret-please-change-me-in-prod-32chars-minimum}
      Jwt__Issuer: future-viewer
      Jwt__Audience: future-viewer
      Privacy__ExportEnabled: ${PRIVACY_EXPORT_ENABLED:-true}
      AI__Provider: ${AI_PROVIDER:-OpenAI}
      AI__Enabled: ${AI_ENABLED:-true}
      AI__RegistryPath: config/processors.json
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      OpenAI__Model: ${OPENAI_MODEL:-gpt-4o}
      OpenAI__BaseUrl: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      DeepSeek__ApiKey: ${DEEPSEEK_API_KEY:-}
      DeepSeek__Model: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DeepSeek__BaseUrl: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      Support__Email: ${SUPPORT_EMAIL:-}
      Email__Transport: ${EMAIL_TRANSPORT:-Smtp}
      Email__Host: ${EMAIL_HOST:-}
      Email__Port: ${EMAIL_PORT:-587}
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__From: ${EMAIL_FROM:-}
      Email__UseSsl: ${EMAIL_USE_SSL:-true}
      Email__FrontendUrl: ${EMAIL_FRONTEND_URL:-http://localhost:5173}
      Payment__Provider: ${PAYMENT_PROVIDER:-Yukassa}
      Payment__Enabled: ${PAYMENT_ENABLED:-true}
      Payment__WebhookEnabled: ${PAYMENT_WEBHOOK_ENABLED:-true}
      Yukassa__ShopId: ${YUKASSA_SHOP_ID:-}
      Yukassa__SecretKey: ${YUKASSA_SECRET_KEY:-}
      Yukassa__ReturnUrl: ${YUKASSA_RETURN_URL:-http://localhost:5173/payment/success}
      Yukassa__Currency: ${YUKASSA_CURRENCY:-RUB}
      Yukassa__MonthlyPriceAmount: ${YUKASSA_MONTHLY_PRICE_AMOUNT:-300}
      Yukassa__ApiBaseUrl: ${YUKASSA_API_BASE_URL:-https://api.yookassa.ru/v3/}
      YooMoney__Receiver: ${YOOMONEY_RECEIVER:-}
      YooMoney__NotificationSecret: ${YOOMONEY_NOTIFICATION_SECRET:-}
      YooMoney__ReturnUrl: ${YOOMONEY_RETURN_URL:-http://localhost:5173/payment/success}
      YooMoney__QuickpayUrl: ${YOOMONEY_QUICKPAY_URL:-https://yoomoney.ru/quickpay/confirm}
      YooMoney__QuickpayForm: ${YOOMONEY_QUICKPAY_FORM:-button}
      YooMoney__PaymentType: ${YOOMONEY_PAYMENT_TYPE:-AC}
      YooMoney__CurrencyCode: ${YOOMONEY_CURRENCY_CODE:-643}
      YooMoney__MonthlyPriceAmount: ${YOOMONEY_MONTHLY_PRICE_AMOUNT:-300}
      YooMoney__Targets: ${YOOMONEY_TARGETS:-Доступ Future Viewer Pro}
    ports:
      - "5050:8080"
    volumes:
      - ./config:/app/config:ro
      - data-protection-keys:/app/data-protection-keys
    networks:
      - proxy
      - data
      - egress
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: fv-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5050
      VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:5173}
      VITE_GOOGLE_SITE_VERIFICATION: ${VITE_GOOGLE_SITE_VERIFICATION:-}
      VITE_YANDEX_VERIFICATION: ${VITE_YANDEX_VERIFICATION:-}
      VITE_YANDEX_METRICA_ID: ${VITE_YANDEX_METRICA_ID:-}
      VITE_MERCHANT_SERVICE_NAME: ${VITE_MERCHANT_SERVICE_NAME:-}
      VITE_MERCHANT_OWNER_NAME: ${VITE_MERCHANT_OWNER_NAME:-}
      VITE_MERCHANT_TAX_STATUS: ${VITE_MERCHANT_TAX_STATUS:-}
      VITE_MERCHANT_INN: ${VITE_MERCHANT_INN:-}
      VITE_MERCHANT_PHONE: ${VITE_MERCHANT_PHONE:-}
      VITE_MERCHANT_EMAIL: ${VITE_MERCHANT_EMAIL:-}
      VITE_MERCHANT_POSTAL_ADDRESS: ${VITE_MERCHANT_POSTAL_ADDRESS:-}
      VITE_PAID_PRODUCT_TITLE: ${VITE_PAID_PRODUCT_TITLE:-}
      VITE_PAID_PRODUCT_PRICE: ${VITE_PAID_PRODUCT_PRICE:-}
      VITE_PAID_PRODUCT_PERIOD: ${VITE_PAID_PRODUCT_PERIOD:-}
      VITE_PAID_PRODUCT_DESCRIPTION: ${VITE_PAID_PRODUCT_DESCRIPTION:-}
      VITE_NPD_RECEIPT_PROCESS_VERIFIED: ${VITE_NPD_RECEIPT_PROCESS_VERIFIED:-false}
      VITE_NPD_RECEIPT_PROCEDURE: ${VITE_NPD_RECEIPT_PROCEDURE:-}
      VITE_SUPPORT_RESPONSE_TERM: ${VITE_SUPPORT_RESPONSE_TERM:-}
      VITE_REFUND_METHOD: ${VITE_REFUND_METHOD:-}
      VITE_CLAIM_REVIEW_PROCEDURE: ${VITE_CLAIM_REVIEW_PROCEDURE:-}
      VITE_LEGAL_OPERATOR_VERIFIED: ${VITE_LEGAL_OPERATOR_VERIFIED:-false}
      VITE_LEGAL_PROCESSORS_VERIFIED: ${VITE_LEGAL_PROCESSORS_VERIFIED:-false}
      VITE_LEGAL_PROCESSORS_JSON: ${VITE_LEGAL_PROCESSORS_JSON:-}
      VITE_LEGAL_DOCUMENT_VERSION: ${VITE_LEGAL_DOCUMENT_VERSION:-}
      VITE_LEGAL_EFFECTIVE_AT: ${VITE_LEGAL_EFFECTIVE_AT:-}
      VITE_LEGAL_OFFER_VERSION: ${VITE_LEGAL_OFFER_VERSION:-}
      VITE_LEGAL_PRIVACY_VERSION: ${VITE_LEGAL_PRIVACY_VERSION:-}
      VITE_LEGAL_PERSONAL_DATA_CONSENT_VERSION: ${VITE_LEGAL_PERSONAL_DATA_CONSENT_VERSION:-}
      VITE_LEGAL_MARKETING_CONSENT_VERSION: ${VITE_LEGAL_MARKETING_CONSENT_VERSION:-}
      VITE_LEGAL_COOKIES_VERSION: ${VITE_LEGAL_COOKIES_VERSION:-}
      VITE_LEGAL_AI_DISCLAIMER_VERSION: ${VITE_LEGAL_AI_DISCLAIMER_VERSION:-}
      VITE_LEGAL_DATA_REQUEST_VERSION: ${VITE_LEGAL_DATA_REQUEST_VERSION:-}
      VITE_LEGAL_PROCESSORS_VERSION: ${VITE_LEGAL_PROCESSORS_VERSION:-}
      VITE_LEGAL_READING_RETENTION: ${VITE_LEGAL_READING_RETENTION:-}
      VITE_LEGAL_ACCOUNT_RETENTION: ${VITE_LEGAL_ACCOUNT_RETENTION:-}
      VITE_LEGAL_CONSENT_RETENTION: ${VITE_LEGAL_CONSENT_RETENTION:-}
      VITE_LEGAL_LOG_RETENTION: ${VITE_LEGAL_LOG_RETENTION:-}
      VITE_LEGAL_BACKUP_RETENTION: ${VITE_LEGAL_BACKUP_RETENTION:-}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  proxy:
  data:
    internal: true
  egress:

volumes:
  data-protection-keys:
  pgdata:
