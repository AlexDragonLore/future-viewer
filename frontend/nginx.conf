log_format privacy '$time_iso8601 request_id=$request_id method=$request_method status=$status bytes=$body_bytes_sent';

server {
    listen 80 default_server;
    server_name _;
    access_log off;
    error_log /dev/stderr crit;
    return 444;
}

server {
    listen 80;
    server_name alex-taro.ru;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    access_log /dev/stdout privacy;
    error_log /dev/stderr crit;

    location = /glossary {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files /glossary/index.html =404;
    }

    location = /about {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files /about/index.html =404;
    }

    location = /privacy {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files /privacy/index.html =404;
    }

    location = /legal {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files /legal/index.html =404;
    }

    location = /faq {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files /faq/index.html =404;
    }

    location ~ ^/tarot/(cards|spreads|decks)/[^/]+$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri/index.html =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location = /noindex.html {
        expires -1;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    location ~ ^/(auth|verify-email|forgot-password|reset-password|result|history|leaderboard|achievements|profile|admin)(/|$) {
        access_log off;
        expires -1;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/index.html /noindex.html;
    }

    location ~ ^/(reading|feedback)(/|$) {
        access_log off;
        expires -1;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/index.html /noindex.html;
    }

    location ~ ^/payment/ {
        access_log off;
        expires -1;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/index.html /noindex.html;
    }

    location ~ ^/glossary/.+ {
        expires -1;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/index.html /noindex.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|ico|webmanifest)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
}
